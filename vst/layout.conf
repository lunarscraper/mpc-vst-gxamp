# Gx Amp MPC skin layout: 4 x 2 controls per tab at fixed positions, in the order of the Force's
# eight knobs (qlinks), as in mpc-vst-rattler (r=48 and the grid of carp 2000; big touch targets,
# no small pads). Frame titles empty: the tab name is in the tab bar. Buttons and switches stay
# off the Q-Links where a tab has enough knobs.
# AMP is the home page (the amp's own front panel), CAB the tonestack and the box, PEDAL the
# stompbox in front, DELAY and REVERB behind, INPUT the source side with its level readout,
# TUNER the tuner, PRESET the 32 slots (the knob only browses, LOAD and SAVE act).
# Palette: Guitarix's dark rack with amber print.
style=td3
font_label=fonts/DejaVuSans-Bold.ttf
label_scale=1.25
theme_bg=1a1b1d
theme_panel=2a2b2e
theme_line=111213
theme_ink=ece6d6
theme_ink_dim=b3ab98
theme_ink_faint=65625a
theme_accent=f29b23
theme_accent_hi=ffc266
theme_knob_face=121314
theme_knob_ring=000000
theme_bar=f29b23
theme_seg_active=f29b23
theme_seg_inactive=121314
theme_seg_active_tx=111111
theme_btn_text=111111
theme_well=0e0f10
theme_knob_off=55534d
theme_tab_on=f29b23
theme_tab_on_tx=111111
theme_lcd=1c1405
theme_box=202124
theme_btn_bg=ece6d6
theme_chrome_ink=ece6d6
theme_go_on=f29b23
theme_go_off=ffc266
theme_tabs=f29b23

[tab AMP]
frame x=36 y=88 w=1207 h=624 title=""
text cx=190 cy=188 label="AMP MODEL" size=2.3
popup cx=190 cy=250 w=220 h=48 label="" key=model
knob cx=490 cy=250 r=48 label="PREGAIN" key=pregain
knob cx=790 cy=250 r=48 label="DRIVE" key=drive
knob cx=1090 cy=250 r=48 label="MASTER" key=master
knob cx=190 cy=530 r=48 label="BASS" key=bass
knob cx=490 cy=530 r=48 label="MIDDLE" key=middle
knob cx=790 cy=530 r=48 label="TREBLE" key=treble
knob cx=1090 cy=530 r=48 label="PRESENCE" key=presence
qlinks "AMP" = model,pregain,drive,master,bass,middle,treble,presence

[tab CAB]
frame x=36 y=88 w=1207 h=624 title=""
text cx=190 cy=188 label="TONESTACK" size=2.3
popup cx=190 cy=250 w=220 h=48 label="" key=stack
text cx=490 cy=188 label="CABINET" size=2.3
popup cx=490 cy=250 w=220 h=48 label="" key=cab
knob cx=790 cy=250 r=48 label="CAB LEVEL" key=cab_level
knob cx=1090 cy=250 r=48 label="DISTORTION" key=dist
text cx=190 cy=478 label="DEEP" size=2.2
toggle cx=190 cy=530 label="" key=deep
knob cx=490 cy=530 r=48 label="PRESENCE" key=presence
knob cx=790 cy=530 r=48 label="MASTER" key=master
knob cx=1090 cy=530 r=48 label="VOLUME" key=volume
qlinks "CAB" = stack,cab,cab_level,dist,presence,master,volume

[tab PEDAL]
frame x=36 y=88 w=1207 h=624 title=""
text cx=190 cy=188 label="PEDAL" size=2.3
popup cx=190 cy=250 w=220 h=48 label="" key=pedal
knob cx=490 cy=250 r=48 label="DRIVE" key=p_drive
knob cx=790 cy=250 r=48 label="TONE" key=p_tone
knob cx=1090 cy=250 r=48 label="LEVEL" key=p_level
knob cx=190 cy=530 r=48 label="AMP PREGAIN" key=pregain
knob cx=490 cy=530 r=48 label="AMP DRIVE" key=drive
knob cx=790 cy=530 r=48 label="MASTER" key=master
knob cx=1090 cy=530 r=48 label="VOLUME" key=volume
qlinks "PEDAL" = pedal,p_drive,p_tone,p_level,pregain,drive,master,volume

[tab DELAY]
frame x=36 y=88 w=1207 h=624 title=""
text cx=190 cy=188 label="TIME" size=2.3
popup cx=190 cy=250 w=220 h=48 label="" key=dly_time
knob cx=490 cy=250 r=48 label="FEEDBACK" key=dly_fb
knob cx=790 cy=250 r=48 label="MIX" key=dly_mix
knob cx=1090 cy=250 r=48 label="TONE" key=dly_tone
text cx=190 cy=478 label="PING-PONG" size=2.2
toggle cx=190 cy=530 label="" key=dly_pp
knob cx=490 cy=530 r=48 label="TIME (FREE)" key=dly_ms when=dly_time:FREE
knob cx=790 cy=530 r=48 label="REVERB MIX" key=rev_mix
knob cx=1090 cy=530 r=48 label="VOLUME" key=volume
qlinks "DELAY" = dly_time,dly_fb,dly_mix,dly_tone,dly_ms,rev_mix,volume

[tab REVERB]
frame x=36 y=88 w=1207 h=624 title=""
knob cx=190 cy=250 r=48 label="MIX" key=rev_mix
knob cx=490 cy=250 r=48 label="ROOM" key=rev_room
knob cx=790 cy=250 r=48 label="DAMP" key=rev_damp
knob cx=1090 cy=250 r=48 label="VOLUME" key=volume
knob cx=190 cy=530 r=48 label="DELAY MIX" key=dly_mix
knob cx=490 cy=530 r=48 label="FEEDBACK" key=dly_fb
qlinks "REVERB" = rev_mix,rev_room,rev_damp,volume,dly_mix,dly_fb

[tab INPUT]
frame x=36 y=88 w=1207 h=624 title=""
knob cx=190 cy=250 r=48 label="INPUT" key=input
text cx=490 cy=188 label="CHANNEL" size=2.3
popup cx=490 cy=250 w=220 h=48 label="" key=in_ch
knob cx=790 cy=250 r=48 label="NOISE GATE" key=gate
knob cx=1090 cy=250 r=48 label="VOLUME" key=volume
text cx=640 cy=455 label="INPUT LEVEL  (PEAKS AROUND -12 dB)" size=2.0
readout cx=640 cy=530 w=760 h=64 label="" key=in_meter
qlinks "INPUT" = input,in_ch,gate,volume

[tab TUNER]
frame x=36 y=88 w=1207 h=624 title=""
text cx=340 cy=180 label="TUNER" size=2.3
popup cx=340 cy=250 w=220 h=48 label="" key=tuner
knob cx=940 cy=250 r=48 label="A4" key=tune_ref
readout cx=640 cy=440 w=600 h=72 label="" key=tuner_note
readout cx=640 cy=560 w=760 h=64 label="" key=tuner_bar
qlinks "TUNER" = tuner,tune_ref

[tab PRESET]
frame x=36 y=88 w=1207 h=624 title=""
button cx=340 cy=390 label="LOAD" key=load
knob cx=640 cy=380 r=48 label="PRESET" key=slot
button cx=940 cy=390 label="SAVE" key=save
qlinks "PRESET" = slot,load,save
